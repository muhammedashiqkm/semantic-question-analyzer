version: '3.8'

services:
  semantic-analyzer-api:
    build:
      context: .
      dockerfile: Dockerfile 
    container_name: semantic-analyzer-api
    ports:
      - "8000:8000"
    environment:
      - FLASK_ENV=production
      - PYTHONUNBUFFERED=1
    env_file:
      - .env
    volumes:
      - logs:/usr/src/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s 
      timeout: 10s   
      retries: 3       
      start_period: 40s

volumes:
  logs:
    driver: local